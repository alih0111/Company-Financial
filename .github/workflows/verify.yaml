name: Verify application and deployment
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: rfa_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: company_financial_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rfa_test -d company_financial_test_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      CODAL_AUTO_SYNC_ENABLED: "0"
      QVT_PAPER_OBSERVER_ENABLED: "0"
      REPORTFLOW_AUTOMATIC_ENABLED: "0"
      RFA_DEPLOY_TEST_DSN: postgresql://rfa_test:isolated-ci-password@127.0.0.1:5432/company_financial_test_ci?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: go-app/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Reject embedded credentials
        run: python scripts/check_secrets.py --tracked-only
      - name: Check process lock portability
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_runtime_lock.py
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r deploy/requirements.txt --progress-spinner off
      - name: Initialize isolated database
        env:
          PGPASSWORD: isolated-ci-password
        run: |
          for migration in canonical_postgres_v1_2_1/sql/*.sql; do
            psql -h 127.0.0.1 -U rfa_test -d company_financial_test_ci -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
      - name: Go tests with race detection
        working-directory: go-app
        run: go test -race ./...
      - name: Go vulnerability audit
        working-directory: go-app
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build and test frontend
        working-directory: client
        run: |
          npm ci
          npm run build
          npm run lint
          npm test
          npm audit --audit-level=moderate
      - name: Require private source before preparing publication
        if: github.event.repository.private != true
        run: |
          echo "::error::This repository contains proprietary research data. Make the source private before publishing deployment artifacts."
          exit 1
      - name: Build deployment image
        run: docker build -t rfa-app:ci .
      - name: Start and verify complete Compose stack
        env:
          RFA_VERSION: ci
        run: |
          python deploy/generate_env.py
          docker compose --env-file deploy/.env up -d --no-build --wait --wait-timeout 180
          python deploy/smoke.py http://127.0.0.1
      - name: Stop test containers
        if: always()
        run: docker compose --env-file deploy/.env down --volumes || true
